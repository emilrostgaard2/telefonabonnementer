name: Byg og deploy til Simply

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installér Pillow og skrifttyper
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core >/dev/null 2>&1 || true
      - name: Hent priser fra Adtraction-feedet
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
        run: python3 _build/update_prices.py
      - name: Byg sitet
        run: |
          TZ=Europe/Copenhagen python3 _build/build.py
          python3 _build/qa.py
      - name: Upload til Simply via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./public/
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
